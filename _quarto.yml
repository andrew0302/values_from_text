project:
  type: website
  output-dir: docs

format:
  html:
    toc: true
    number-sections: false
    code-fold: true
    css: styles.css
    csl: apa.csl

  pdf:
    output-file: manuscript.pdf
    documentclass: apa7
    classoption: [man]
    keep-tex: true
    cite-method: biblatex
    citeproc: false
